# toggle/open/close manage the popup on the menu. The per-game actions are
# the ones to bind to keys: each opens its game directly, closes the popup
# when that game is already showing, and switches over from any other screen.
[[actions]]
id = "toggle"
title = "Herdr Arcade: toggle menu"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "toggle"]

[[actions]]
id = "open"
title = "Herdr Arcade: open menu"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "open"]

[[actions]]
id = "close"
title = "Herdr Arcade: close"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "close"]

[[actions]]
id = "tetris"

id = "stokje-dev.arcade"
name = "Herdr Arcade"
version = "2.1.0"
min_herdr_version = "0.9.1"
platforms = ["macos", "linux"]
description = "Seventeen golden-era arcade games in a popup pane that pauses itself when a session agent needs attention."

# One entrypoint per start screen: the splash menu, and each game directly
# (what the per-game actions below open, so a key binding can jump straight
# into a game). A fixed 96x30 popup (93x28 inner area, 3 cols and 2 rows of
# chrome) overlays the layout instead of disturbing it; every screen lays out
# for that size first and adapts down to smaller panes.
[[panes]]
id = "arcade"
title = "Herdr Arcade"
placement = "popup"
width = 96
height = 30
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/arcade.py\""]

[[panes]]
id = "tetris"
title = "Herdr Arcade: tetris"
placement = "popup"
width = 96
height = 30
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/arcade.py\" --game tetris"]

